<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Скифы Алтая. Древности Сибири</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===================== ЗАГРУЗКА (до старта видео, пока прогружаются все ассеты) ===================== -->
  <section class="screen active" id="screen-boot">
    <div class="boot-loading">
      <div class="boot-eyebrow">Скифы Алтая · Древности Сибири</div>
      <div class="boot-dots"><span></span><span></span><span></span></div>
    </div>
  </section>

  <!-- ===================== ВИДЕО-ЗАСТАВКА ===================== -->
  <section class="screen" id="screen-video"></section>

  <!-- ===================== КАРТА (ТЗ п.9) ===================== -->
  <section class="screen" id="screen-map">
    <div class="map-mount"></div>
  </section>

  <!-- ===================== ЭКРАН ОБЪЕКТА — общий шаблон (ТЗ п.9-10) ===================== -->
  <section class="screen" id="screen-object">
    <div class="topbar">
      <div class="topbar-spacer"></div>
      <div class="site-title"><h1 class="obj-title" id="objTitle">Объект</h1></div>
      <div class="topbar-spacer"></div>
    </div>
    <button class="btn ghost btn-back" id="btnBackFromObject">Назад</button>
    <div class="obj-body">

      <!-- Стандартная раскладка (объекты без своего layout) -->
      <div class="obj-standard" id="objStandard">
        <div class="stage-3d" id="stage3d"></div>
        <div class="stage-2d" id="stage2d"></div>

        <div class="text-panel">
          <div class="text-slider">
            <button class="text-arrow" id="txtPrev" aria-label="Предыдущий блок">‹</button>
            <div class="text-content">
              <h3 id="txtHeading">—</h3>
              <p id="txtBody">—</p>
              <p id="txtLocation" class="txt-location"></p>
            </div>
            <button class="text-arrow" id="txtNext" aria-label="Следующий блок">›</button>
          </div>
          <div class="dots" id="txtDots"></div>
        </div>
      </div>

      <!-- Особые раскладки: beast-grid / human-split / carpet-split (см. js/app.js) -->
      <div class="obj-custom hidden" id="objCustom"></div>

    </div>
  </section>

  <!-- ===================== АВТОРЫ (ТЗ п.15) ===================== -->
  <section class="screen" id="screen-authors">
    <div class="topbar">
      <div class="topbar-spacer"></div>
      <div class="site-title"><h1>Авторы проекта</h1></div>
      <div class="topbar-spacer"></div>
    </div>
    <button class="btn ghost btn-back" id="btnBackFromAuthors">Назад</button>
    <div class="authors-body"></div>
  </section>

</div>

<!--
  Import map: локальные модули Three.js (см. README.md → «Подключение Three.js»).
  Пока файлы не добавлены в js/vendor/ — приложение работает в режиме
  заглушки (см. js/screens/object3d.js), ничего не ломается.
-->
<!--
  Фикс мобильных браузеров: 100vh не учитывает то, что адресная строка
  может появляться/исчезать, из-за чего часть интерфейса (в т.ч. поля
  под 3D-модели) может обрезаться. Дублирует то же самое, что делает
  100dvh в современных браузерах, но работает и в старых — считаем
  реальную высоту окна и кладём в CSS-переменную --vh.
-->
<script>
  function setVh() {
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVh();
  window.addEventListener('resize', setVh);
  window.addEventListener('orientationchange', setVh);
</script>
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.js",
    "three/addons/": "./js/vendor/addons/"
  }
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
